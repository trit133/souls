<!doctype html>
<!-- Listening page for the soundtrack (dev server only; not part of the build). -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ashen Vigil · Jukebox</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #120a08; color: #f3d9b1; font: 16px/1.4 monospace; }
    main { width: min(92vw, 440px); padding: 24px; border: 3px solid #6b2a12; background: #1d0f0a; box-shadow: 0 0 0 3px #2a120a, 0 0 40px #ff5a1a22; }
    h1 { margin: 0 0 4px; font-size: 22px; color: #ff9a3c; letter-spacing: 2px; }
    p { margin: 0 0 18px; color: #b98d6a; font-size: 13px; }
    button { display: block; width: 100%; margin: 0 0 10px; padding: 14px; font: inherit; font-weight: bold; color: #fff1dc; background: #7a2410; border: 3px solid #c2501f; cursor: pointer; }
    button:hover { background: #9a3214; }
    button.on { background: #c2501f; border-color: #ffb36b; }
    #stop { background: #2a1a14; border-color: #5a3a2a; }
    label { display: flex; gap: 10px; align-items: center; margin-top: 14px; font-size: 13px; }
    input { flex: 1; accent-color: #ff7a2a; }
    #now { margin-top: 14px; font-size: 13px; color: #ffb36b; min-height: 1.4em; }
  </style>
</head>
<body>
  <main>
    <h1>VAREK · THRONE OF ASH</h1>
    <p>Phase 2 is what plays once he ignites. Press it while phase 1 is playing and it switches on the next bar, the same way it does in the fight.</p>
    <button data-song="varek1">Phase 1</button>
    <button data-song="varek2">Phase 2: he ignites</button>
    <button id="stop">Stop</button>
    <button id="beep">Test beep</button>
    <label>Volume <input id="vol" type="range" min="0" max="1" step="0.05" value="0.8" /></label>
    <div id="now"></div>
    <div id="state" style="margin-top:6px;font-size:12px;color:#8a6a52"></div>
  </main>
  <script type="module">
    import { Music } from './src/music.js';
    let ctx, vol, band;
    const now = document.getElementById('now');
    const mark = () => document.querySelectorAll('[data-song]').forEach((b) => b.classList.toggle('on', b.dataset.song === band?.playing));
    const state = document.getElementById('state');
    setInterval(() => { state.textContent = ctx ? `Audio ${ctx.state}, ${ctx.sampleRate} Hz` : 'Audio not started yet: press a button'; }, 250);
    // iPhone/iPad: play through the mute switch, and wake the audio inside the tap
    const start = () => {
      if (navigator.audioSession) try { navigator.audioSession.type = 'playback'; } catch {}
      if (!ctx) {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        vol = ctx.createGain(); vol.gain.value = +document.getElementById('vol').value; vol.connect(ctx.destination);
        band = new Music(ctx, vol);
      }
      ctx.resume();
      const s = ctx.createBufferSource(); s.buffer = ctx.createBuffer(1, 1, 22050); s.connect(ctx.destination); s.start();
    };
    document.getElementById('beep').addEventListener('click', () => {
      start();
      const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime;
      o.frequency.value = 660; g.gain.setValueAtTime(0.3, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
      o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + 0.5);
    });
    setInterval(() => { mark(); now.textContent = band?.playing ? `Playing ${band.playing === 'varek1' ? 'phase 1' : 'phase 2'} · bar ${Math.floor(band.cur.pos / 16) + 1}` : ''; }, 100);
    document.querySelectorAll('[data-song]').forEach((b) => b.addEventListener('click', () => {
      start();
      band.play(b.dataset.song);
    }));
    document.getElementById('stop').addEventListener('click', () => band?.stop(1));
    document.getElementById('vol').addEventListener('input', (e) => vol && (vol.gain.value = +e.target.value));
  </script>
</body>
</html>
